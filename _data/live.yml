# =============================================================================
#  Live shows  ->  https://kut.ai/live/
# =============================================================================
#
#  TO ADD A SHOW, run ./add-show from the repo root, or add a block by hand at
#  the bottom of the `shows:` list. Order does not matter, the page sorts.
#
#      - date: 2026-08-14
#        act: Makamscape
#        venue: Rhizome, Takoma Park DC
#
#  Only `date`, `act` and `venue` are required. Optional fields:
#
#        event: Subscape        the night or bill, set above the act name
#        time: 8:00 PM          shown next to the venue
#        tickets: https://...   adds a "Tickets" link to the card
#        kind: dj set           tags the card (show is the default, no tag)
#        note: Album release    one short line under the venue
#
#  A new act needs no setup, it gets a color automatically. Add it to `acts:`
#  below only if you want to pick the color or link it to its own page.
#
#  Venue names link to Google Maps automatically, searched on "Venue, City".
#  Only add a venue to `venues:` if that search lands in the wrong place.
#
# =============================================================================

# Colors: rose, amber, azure, jade, violet, copper
acts:
  Orchester Praževica:
    color: rose
    url: http://prazevica.com/
  Makamscape:
    color: amber
    url: /music/makamscape/
  Yeden:
    color: azure
    url: /music/yeden/
  DJ Dolma:
    color: jade
    url: /music/dj-dolma/
  Meshk:
