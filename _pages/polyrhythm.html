<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Polyrhythm — kut.ai</title>
    <meta name="description" content="An orbital polyrhythm machine. Stack rhythms and hear the spheres.">
    <meta name="theme-color" content="#070A12">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/polyrhythm.css?v={{ site.time | date: '%s' }}">
  </head>
  <body>

    <main class="stage">
      <a class="brand__home stage__home" href="/">&larr; kut.ai</a>

      <canvas id="sky" aria-hidden="true"></canvas>

      <button id="playBtn" class="star" aria-label="Play" aria-pressed="false">
        <svg class="star__icon star__icon--play" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5z"/>
        </svg>
        <span class="star__icon--pause star__moon" aria-hidden="true">月</span>
      </button>
    </main>

    <aside class="rack" aria-label="Controls">
      <header class="brand">
        <h1 class="brand__mark">Polyrhythm</h1>
        <div class="view" role="group" aria-label="View">
          <button id="viewOrbit" class="view__btn" type="button" aria-pressed="true">Orbital</button>
          <button id="viewLinear" class="view__btn" type="button" aria-pressed="false">Linear</button>
        </div>
      </header>

      <section class="rack__block">
        <div class="tempo__readout">
          <h2 class="rack__label tempo__title">Tempo</h2>
          <span class="tempo__main">
            <span id="bpmVal" class="tempo__value">90</span>
            <span class="tempo__unit">bpm</span>
          </span>
          <span id="periodVal" class="tempo__period">2.67 s</span>
        </div>
        <input id="bpmRange" type="range" min="30" max="220" step="1" value="90"
               aria-label="Tempo in beats per minute">
        <button id="gridToggle" class="gridtoggle" type="button" role="switch"
                aria-pressed="false" aria-label="Beat grid visibility (tap to toggle, drag to adjust)">
          <span class="gridtoggle__base">Beat grid</span>
          <span class="gridtoggle__lit" aria-hidden="true">Beat grid</span>
        </button>
      </section>

      <section class="rack__block">
        <h2 class="rack__label">Rhythms</h2>
        <div id="layers"></div>
        <button id="addBtn" class="add" type="button">+ Add rhythm</button>
      </section>
    </aside>

    <script src="/assets/js/polyrhythm.js?v={{ site.time | date: '%s' }}"></script>
  </body>
</html>
